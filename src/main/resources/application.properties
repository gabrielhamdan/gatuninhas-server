spring.application.name=gatuninhas-api
spring.application.version=1.0

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Datasource ----------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gatuninhas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gatuninhas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gatuninhas}

# ---------- JPA / Flyway ----------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=${SERVER_PORT:8080}

# ---------- JWT ----------
app.jwt.access-secret=${JWT_ACCESS_SECRET:dev-only-access-secret-troque-isto-em-qualquer-outro-ambiente}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:dev-only-refresh-secret-troque-isto-em-qualquer-outro-ambiente}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
