services:
  db:
    image: postgres:18.6-alpine
    container_name: gatuninhas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gatuninhas}
      POSTGRES_USER: ${POSTGRES_USER:-gatuninhas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gatuninhas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gatuninhas_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gatuninhas} -d $${POSTGRES_DB:-gatuninhas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gatuninhas-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: gatuninhas-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-gatuninhas}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gatuninhas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gatuninhas}
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-jwt_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-jwt_refresh_secret}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "5005:5005"
    volumes:
      - .:/app
    networks:
      - gatuninhas-net

networks:
  gatuninhas-net:
    driver: bridge

volumes:
  gatuninhas_pgdata: